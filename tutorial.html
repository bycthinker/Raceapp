<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutoriel · Raceapp</title><link rel="stylesheet" href="guide.css"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="manette.css"><script src="manette.js"></script><body class="grid-scene"><main><form action="index.html"><button type="submit" class="back-button">Retour</button></form><p id="step"></p><section aria-live="polite"><h1 id="title"></h1><svg viewBox="0 0 320 140" role="img" aria-labelledby="title" id="diagram"></svg><p id="body"></p></section><button id="back">Précédent</button> <button id="next" data-pad-first>Suivant</button></main><script>
const pages=[
['Choisis une intersection','Au départ, tu es à l’arrêt. Choisis un cercle voisin pour avancer d’une case. La flèche de la piste donne le sens de la course.'],
['Prolonge ton mouvement','Imagine que tu répètes ton dernier déplacement. Tu obtiens le point central. Choisis ce centre pour garder ton élan ou un de ses huit voisins pour accélérer, freiner ou tourner. La vitesse maximale est 6.'],
['Valide ton choix','Le cercle sélectionné passe en surbrillance. À la manette, la croix ou le stick gauche choisit la case, A valide et B annule la sélection. Appuie sur « Valider le déplacement ». Si la double pression est activée, deux pressions rapides sur le même cercle valident aussi ton coup.'],
['Prépare le virage','Freine avant de tourner. Pour une sortie, seuls les plus petits chiffres hors piste autorisés restent proposés. Une sortie impose deux coups à vitesse 1, diagonales comprises. Reste à 1 tant que tu es dehors. Tu ne peux pas traverser une autre voiture.'],
['Franchis la ligne','Sur le petit ovale, fais un tour complet puis dépasse le damier dans le sens de la flèche. En multijoueur, chacun termine la manche. Le plus loin après la ligne gagne ; à distance égale, les pilotes partagent la victoire.']
];
let i = location.hash === '#ovale' ? pages.length - 1 : 0;
function draw(){
 document.querySelector('#step').textContent='Tutoriel · '+(i+1)+' / '+pages.length;
 document.querySelector('#title').textContent=pages[i][0];document.querySelector('#body').textContent=pages[i][1];
 let art='<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#486158"/></pattern><pattern id="flag" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fafcf4"/><path d="M0 0h6v6H0zM6 6h6v6H6z" fill="#17231e"/></pattern></defs><rect width="320" height="140" fill="url(#grid)"/>';
 const dot=(x,y,r,fill)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" stroke="#b9ee94" stroke-width="2" fill="'+fill+'"/>';
 if(i<3){
 const x=i===0?96:168;art+='<path d="M48 72H96" stroke="#82aa80" stroke-width="3"/>';art+=dot(96,72,7,'#b9ee94');
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(i===0&&!a&&!b)continue;art+=dot(x+a*24,72+b*24,6,i===2&&a===1&&b===-1?'#b9ee94':'#1c3026');}
 if(i>0)art+='<path d="M96 72H168" stroke="#b9ee94" stroke-dasharray="4 4"/>'+dot(168,72,9,'none');
 if(i>0)art+='<path d="M24 72H96" stroke="#b9ee94" stroke-width="3"/>';
 }else if(i===3){art+='<path d="M0 96H144Q193 96 193 0" fill="none" stroke="#9ab7a7" stroke-width="4"/><path d="M72 72H120L168 48L192 24" fill="none" stroke="#a9df94" stroke-width="3"/>';for(const [x,y] of [[72,72],[120,72],[168,48],[192,24]])art+=dot(x,y,5,'#b9ee94');}
 else{art+='<rect x="126" width="12" y="24" height="96" fill="url(#flag)"/><path d="M210 72H72l14 -10m-14 10 14 10" fill="none" stroke="#b9ee94" stroke-width="4"/>'+dot(72,72,6,'#b9ee94');}
 document.querySelector('#diagram').innerHTML=art;document.querySelector('#back').disabled=!i;document.querySelector('#next').textContent=i===4?'Piloter sur l’ovale':'Suivant';
}
document.querySelector('#back').onclick=()=>{if(i)i--;draw()};document.querySelector('#next').onclick=()=>{if(i===4)location.href='local.html?mode=tuto';else{i++;draw()}};draw();
</script></body></html>
