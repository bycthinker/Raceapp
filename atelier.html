<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier de circuits · Raceapp</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12211d;color:#172922;font:16px/1.45 "DM Sans",system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:14px clamp(12px,3vw,48px) 32px}header{display:flex;justify-content:space-between;align-items:center;color:#f3f4e8;padding:8px 0 16px}header a{color:#cfebac;text-decoration:none}h1{font-size:clamp(26px,4vw,48px);letter-spacing:-.065em;margin:0}article{display:grid;grid-template-columns:minmax(0,1fr) 260px;background:#f6f5e9;border-radius:16px;overflow:hidden}section{min-width:0}aside{padding:20px;border-left:1px solid #c3caba;display:flex;flex-direction:column;gap:11px}label{display:block;font-weight:650}button,select,input{font:inherit}button,select,input[type=text]{background:#fffef5;border:1px solid #aab8aa;border-radius:8px;padding:8px 12px;color:inherit;min-height:42px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true],.primary{background:#205143;color:#fff;border-color:#205143}.tools{display:flex;flex-wrap:wrap;gap:7px;padding:10px}.sheet{background:#f4f3dd;width:100%;display:block;touch-action:none;cursor:crosshair;user-select:none}#hint{min-height:44px;padding:8px 14px;margin:0;border-top:1px solid #c3caba;color:#344a40}input[type=range]{width:100%;accent-color:#245745}output{float:right;font-variant-numeric:tabular-nums}hr{border:0;border-top:1px solid #cad1bf;width:100%}select,input[type=text]{width:100%}#test{background:#cced87}.start{pointer-events:none}@media(max-width:760px){article{display:block}aside{border:0;border-top:1px solid #c3caba;display:grid;grid-template-columns:1fr 1fr;padding:12px}aside label,aside hr,#shelf{grid-column:1/-1}.tools button{font-size:14px;padding:6px 9px}header{padding-top:0}}
#sheet *{pointer-events:none}</style><main><header><h1>Atelier de circuits</h1><a href="./">← Raceapp</a></header><article><section><div class="tools"><button id="pen" aria-pressed="true">Dessiner</button><button id="edit">Retoucher</button><button id="close">Fermer la boucle</button><button id="finish">Placer l’arrivée</button><button id="reverse">Inverser le sens</button><button id="resetView">Vue entière</button><button id="undo">Annuler</button></div>
<svg style="aspect-ratio:3/2;-webkit-user-select:none" class="sheet" id="sheet" viewBox="0 0 96 64" aria-label="Feuille quadrillée pour dessiner ton circuit"><defs><pattern id="small" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#95aba1" stroke-width=".055"/></pattern><pattern id="big" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#small)"/><path d="M5 0H0V5" fill="none" stroke="#739789" stroke-width=".095"/></pattern></defs><rect width="96" height="64" fill="url(#big)"/><g id="drawing"></g></svg><p id="hint" role="status"></p></section><aside>
<label>Nom du circuit<input id="name" type="text" maxlength="40" value="Mon circuit"></label>
<label>Largeur de piste <small id="widthScope"></small> <output id="widthVal"></output><input id="width" type="range" min="3" max="6" step=".25" value="4"></label>
<label>Arrondi du virage <output id="roundVal"></output><input id="round" type="range" min="0" max="100" value="65"></label>
<button id="save" class="primary">Enregistrer</button><button id="test">Essayer en solo</button><hr>
<label for="shelf">Mes circuits</label><select id="shelf"></select><button id="load">Ouvrir</button><button id="fresh">Nouveau tracé</button></aside></article></main>
<script src="atelier-core.js"></script><script src="atelier.js"></script></html>
